# fly.toml app configuration file generated for wherepay-old-shape-6823 on 2026-03-29T00:57:56+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wherepay-old-shape-6823'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '22'
    PHP_VERSION = '8.5'

[env]
  APP_ENV = 'production'
  APP_NAME = 'wherepay'
  APP_URL = 'https://wherepay-old-shape-6823.fly.dev'
  APP_LOCALE = 'ja'
  APP_FALLBACK_LOCALE = 'ja'
  APP_FAKER_LOCALE = 'ja_JP'
  APP_MAINTENANCE_DRIVER = 'file'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_LIFETIME = 120
  SESSION_ENCRYPT = 'false'
  SESSION_PATH = '/'
  SESSION_DOMAIN = 'null'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/data/database.sqlite'
  DB_BUSY_TIMEOUT = '5000'
  DB_JOURNAL_MODE = 'WAL'
  DB_SYNCHRONOUS = 'NORMAL'
  CACHE_STORE = 'file'
  QUEUE_CONNECTION = 'sync'
  VITE_APP_NAME = "${APP_NAME}"
  WWWUSER = 1000
  WWWGROUP = 1000

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 100
    hard_limit = 120

[mounts]
  source = 'wherepay_data'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
