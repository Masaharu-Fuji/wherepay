; PHP 8.5 always includes OPcache. The deploy image does not change PHP sources,
; so keep the optimized bytecode and do not stat files on each request.
; JIT stays off: this host has 512MB, and tracing JIT is a poor fit for short PHP requests.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.jit=disable
opcache.jit_buffer_size=0
